[workspace]
resolver = "2"
members = [
    "crates/neutrino-host",
    "crates/neutrino-bridge",
    "crates/neutrino-core",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
wit-bindgen = "0.43"
wasmtime = { version = "38", default-features = false, features = ["cranelift", "runtime", "component-model"] }
wasmtime-wasi = "38"
wry = { version = "0.47", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
